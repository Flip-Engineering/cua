name: Windows resize qualification

on: workflow_dispatch

permissions:
  contents: read

jobs:
  qualify:
    runs-on:
      group: baton2-native-homelab
      labels: [self-hosted, Linux, X64, baton2-native-linux-x64]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "5"
      CUA_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: c5d982cc9e0ffc92554d8b01993392e86cf53668
          persist-credentials: false
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-gnullvm
      - name: Focused readiness tests
        working-directory: libs/cua
        run: cargo test --locked --profile dev-fast -p cua-sandbox-core --lib --test providers --test resize --test readiness_clock
      - name: Build Windows Cua
        working-directory: libs/cua
        shell: bash
        run: |
          set -euo pipefail
          asset=llvm-mingw-20261117-ucrt-ubuntu-22.04-x86_64
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/$asset.tar.xz"
          printf '%s  %s\n' e7a15a49a2ea95e9f3d8a9d0cfabe5052a4b10fb4777cc54de5a8c27b64bb701 "$RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$asset/bin:$PATH"
          export CC_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-clang
          export CXX_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-clang++
          export AR_x86_64_pc_windows_gnullvm=llvm-ar
          export RC_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-windres
          export WINDRES=x86_64-w64-mingw32-windres
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=x86_64-w64-mingw32-clang
          cargo build --locked --profile dev-fast --target x86_64-pc-windows-gnullvm -p cua-spaces-cli --bin cua-spaces-cli --no-default-features
          mkdir "$RUNNER_TEMP/resize-dist"
          cp target/x86_64-pc-windows-gnullvm/dev-fast/cua-spaces-cli.exe "$RUNNER_TEMP/resize-dist/cua.exe"
          git rev-parse HEAD > "$RUNNER_TEMP/resize-dist/source-commit.txt"
          (cd "$RUNNER_TEMP/resize-dist" && sha256sum cua.exe > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cua-windows-resize-qualification
          path: ${{ runner.temp }}/resize-dist/
          retention-days: 3
          if-no-files-found: error
