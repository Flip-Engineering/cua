name: "CD: cua-spacesd"

# Builds the cua-spacesd release assets for tag `cua-spacesd-v<version>`
# (created by release-please, component `cua-spacesd`). Asset names and
# layouts are fixed by their consumers; packaging/release/package.sh documents
# the mapping. Per platform:
#
#   cua-spacesd-<triple>.tar.gz     linux x86_64/aarch64, macOS (universal
#                                      binary under both darwin triples)
#   cua-spacesd-<triple>.zip        windows x86_64 (cua-spacesd.exe)
#   cua-spacesd-<os>-<arch>.tar.gz  cua-host (`cua host setup`) and
#                                      libs/images/linux
#   cua-spacesd-<triple>[.exe]      bare binary (packaging/install.sh/.ps1)
#   cua-spacesd-macos-universal.app.zip  "Cua Spacesd.app" (signed and
#                                      notarized when the secrets exist)
#   <asset>.sha256 for each, plus SHA256SUMS
#
#   cua-spacesd-<arch>-unknown-linux-musl  the static headless build (no
#                                      desktop), bare and as a .tar.gz; the
#                                      `cua` CLI and the Spaces app bundle it
#                                      to inject into OCI images that carry
#                                      none (cua-spacesd-linux-static-<arch>)
#
# Archives hold the binary, LICENSE and THIRD_PARTY_NOTICES.md at the root.
# Linux builds in debian:11 (glibc 2.31 floor, OpenSSL vendored statically via
# the workspace `native-tls/vendored` feature); the musl targets are fully
# static. A publishing run on trycua/cua
# requires macOS Developer ID signing + notarization and Windows Authenticode
# (Azure Artifact Signing through the `cua-driver-release-signing`
# environment) and fails without them; a dry run may ship ad-hoc signed /
# unsigned artifacts. On any other repository (trycua/cua-staging) a missing
# secret gives ad-hoc signed / unsigned assets, published as a prerelease
# whose title and notes say so. The release (a Release Please draft) is
# published once every asset is attached, with a keyless Sigstore bundle per
# asset.
#
# A manual dispatch is a dry run by default (artifacts only). With
# dry_run=false it rebuilds an existing `cua-spacesd-v<version>` tag and
# uploads to its release (recovery for a failed tag run). Flip packaging tags
# append -flip.N to the unchanged upstream daemon version.

on:
  push:
    tags:
      - "cua-spacesd-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the cua-spacesd-v prefix)"
        required: true
      dry_run:
        description: "Build only; set false to rebuild the existing tag and upload to its release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cd-cua-spacesd-${{ github.ref }}-${{ inputs.version || '' }}
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # Registries and the fail-closed signing gates are for trycua/cua only.
  CANONICAL: ${{ github.repository == 'trycua/cua' }}

jobs:
  version:
    runs-on: [self-hosted, Linux, X64, docker-linux]
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/cua-spacesd-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cua-spacesd-v}"
            REF="$GITHUB_REF"
            PUBLISH=true
          else
            VERSION="${INPUT_VERSION#v}"
            if [[ "$INPUT_DRY_RUN" == "false" ]]; then
              REF="refs/tags/cua-spacesd-v$VERSION"
              PUBLISH=true
            else
              REF="$GITHUB_SHA"
              PUBLISH=false
            fi
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid version $VERSION" >&2; exit 1
          fi
          PRERELEASE=false
          # Off trycua/cua every release is a prerelease (never "latest").
          [[ "$VERSION" == *-* || "$CANONICAL" != true ]] && PRERELEASE=true
          {
            echo "version=$VERSION"
            echo "tag=cua-spacesd-v$VERSION"
            echo "ref=$REF"
            echo "publish=$PUBLISH"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "cua-spacesd $VERSION from $REF (publish=$PUBLISH, prerelease=$PRERELEASE)"

  # The binary reports the Cargo workspace version, so a published build must
  # come from a tree whose VERSION / Cargo.toml match the tag.
  check-version:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: [self-hosted, Linux, X64, docker-linux]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Tag matches VERSION and the Cargo workspace
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < libs/cua-spacesd/VERSION)"
          CARGO_VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' libs/cua-spacesd/Cargo.toml)"
          SOURCE_VERSION="$VERSION"
          if [[ "$GITHUB_REPOSITORY" == Flip-Engineering/cua && "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-flip\.[1-9][0-9]*$ ]]; then
            SOURCE_VERSION="${BASH_REMATCH[1]}"
          fi
          echo "tag=$VERSION source=$SOURCE_VERSION VERSION=$FILE_VERSION Cargo.toml=$CARGO_VERSION"
          test "$FILE_VERSION" = "$SOURCE_VERSION"
          test "$CARGO_VERSION" = "$SOURCE_VERSION"

  linux:
    needs: version
    name: linux ${{ matrix.arch }}
    runs-on: [self-hosted, Linux, X64, docker-linux]
    container: debian:11
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-gnu, profile: release }
          - { arch: aarch64, target: aarch64-unknown-linux-gnu, profile: release }
          # The static headless daemon injected into OCI images (the small
          # `static` profile of libs/cua-spacesd/Cargo.toml).
          - { arch: x86_64, target: x86_64-unknown-linux-musl, profile: static }
          - { arch: aarch64, target: aarch64-unknown-linux-musl, profile: static }
    defaults:
      run:
        shell: bash
    steps:
      # debian:11 is bare. Without git, actions/checkout downloads the tree
      # through the REST API, which is all the build needs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Install build dependencies
        run: bash libs/cua-spacesd/packaging/release/debian-build-deps.sh
      - &setup_linux_arm64
        name: Set up the ARM64 cross toolchain
        if: matrix.arch == 'aarch64'
        run: bash libs/cua-spacesd/packaging/release/setup-linux-arm64.sh ${{ matrix.target }}
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: libs/cua-spacesd
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ matrix.profile }}
        run: |
          case "$TARGET" in
            aarch64-unknown-linux-gnu) zig_target="$TARGET.2.31" ;;
            aarch64-unknown-linux-musl) zig_target="$TARGET" ;;
            *) exec cargo build --target "$TARGET" --locked --profile "$PROFILE" -p cua-spacesd --bin cua-spacesd ;;
          esac
          # Zig opens the link's object files together. Use the container's allowed limit.
          ulimit -Sn "$(ulimit -Hn)"
          cargo zigbuild --target "$zig_target" --locked --profile "$PROFILE" -p cua-spacesd --bin cua-spacesd
      - name: Check glibc floor and static OpenSSL
        if: endsWith(matrix.target, '-gnu')
        working-directory: libs/cua-spacesd
        run: bash packaging/release/check-linux-binary.sh target/${{ matrix.target }}/${{ matrix.profile }}/cua-spacesd 2.31
      - name: Check the static build
        if: endsWith(matrix.target, '-musl')
        working-directory: libs/cua-spacesd
        run: bash packaging/release/check-static-binary.sh target/${{ matrix.target }}/${{ matrix.profile }}/cua-spacesd
      - name: Package
        working-directory: libs/cua-spacesd
        run: |
          bash packaging/release/package.sh --binary target/${{ matrix.target }}/${{ matrix.profile }}/cua-spacesd \
            --target ${{ matrix.target }} --out "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-spacesd-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    name: macos universal
    runs-on: [self-hosted, macOS, X64, flip-macos-lab]
    timeout-minutes: 120
    env:
      # Hoisted so step conditions never read `secrets` directly.
      APPLICATION_CERT_BASE64: ${{ secrets.APPLICATION_CERT_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      DEVELOPER_NAME: ${{ secrets.DEVELOPER_NAME }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      KEYCHAIN_PASSWORD: temporary-cd-keychain-pwd
      BUNDLE_ID: com.trycua.cua-env-driver
      PUBLISH: ${{ needs.version.outputs.publish }}
      # A publishing run on trycua/cua never ships unsigned assets.
      REQUIRE_SIGNING: ${{ needs.version.outputs.publish == 'true' && github.repository == 'trycua/cua' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build x86_64 and cross-compile arm64 using the macOS SDK
        working-directory: libs/cua-spacesd
        run: |
          set -euo pipefail
          # The Intel lab uses the same installed SDK for both target slices.
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          # ScreenCaptureKit in this tree needs the macOS 26 SDK or later.
          test "${sdk_version%%.*}" -ge 26
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$target" -p cua-spacesd --bin cua-spacesd
          done
      - name: Universal binary (lipo)
        working-directory: libs/cua-spacesd
        run: |
          set -euo pipefail
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/cua-spacesd \
            target/x86_64-apple-darwin/release/cua-spacesd \
            -output target/universal/cua-spacesd
          lipo -verify_arch arm64 x86_64 target/universal/cua-spacesd
          # .cargo/config.toml links the Swift runtime rpath for both slices.
          otool -l target/universal/cua-spacesd | grep -A2 LC_RPATH | grep -q /usr/lib/swift

      - name: Detect signing configuration
        id: signing
        run: |
          if [ -n "$APPLICATION_CERT_BASE64" ] && [ -n "$DEVELOPER_NAME" ] && [ -n "$TEAM_ID" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Developer ID secrets; shipping ad-hoc signed macOS assets."
          fi
          if [ -n "$APPLICATION_CERT_BASE64" ] && [ -n "$APPLE_ID" ] && [ -n "$APP_SPECIFIC_PASSWORD" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi
          # A trycua/cua release never ships ad-hoc signed or unnotarized.
          if [ "$REQUIRE_SIGNING" = true ]; then
            for name in APPLICATION_CERT_BASE64 CERT_PASSWORD DEVELOPER_NAME TEAM_ID APPLE_ID APP_SPECIFIC_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::refusing to publish unsigned macOS assets: $name is not set"
                exit 1
              fi
            done
          fi
      - name: Import code-signing certificate
        if: steps.signing.outputs.sign == 'true'
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          echo "$APPLICATION_CERT_BASE64" | base64 --decode > application.p12
          security import application.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign > /dev/null 2>&1
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null 2>&1
          rm application.p12
          test "$(security find-identity -v -p codesigning build.keychain | grep -c 'Developer ID Application')" -ge 1

      - name: Sign the bare binary and build Cua Spacesd.app
        working-directory: libs/cua-spacesd
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          BIN=target/universal/cua-spacesd
          if [ "$SIGN" = true ]; then
            IDENTITY="Developer ID Application: ${DEVELOPER_NAME} (${TEAM_ID})"
            codesign --force --timestamp --options runtime --identifier "$BUNDLE_ID" \
              --sign "$IDENTITY" "$BIN"
            export CUA_ENV_CODESIGN_IDENTITY="$IDENTITY" CUA_ENV_CODESIGN_HARDENED=1
          else
            codesign --force --identifier "$BUNDLE_ID" --sign - "$BIN"
          fi
          codesign --verify --strict --verbose=2 "$BIN"
          # The bundle wraps a copy of the same universal binary.
          CUA_SPACESD_PREBUILT="$BIN" CUA_ENV_BUNDLE_ID="$BUNDLE_ID" \
            CUA_ENV_BUNDLE_VERSION="$VERSION" scripts/build-macos-app.sh
          codesign -dv --verbose=2 "target/macos/Cua Spacesd.app" 2>&1 | grep -E 'Identifier|TeamIdentifier|flags'

      - name: Notarize (binary + app) and staple the app
        if: steps.signing.outputs.notarize == 'true' && steps.signing.outputs.sign == 'true'
        working-directory: libs/cua-spacesd
        run: |
          set -euo pipefail
          mkdir -p target/notarize
          cp target/universal/cua-spacesd target/notarize/
          ditto "target/macos/Cua Spacesd.app" "target/notarize/Cua Spacesd.app"
          ditto -c -k --keepParent target/notarize target/notarize.zip
          xcrun notarytool submit target/notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_SPECIFIC_PASSWORD" \
            --wait --timeout 30m
          # Bare Mach-O binaries cannot be stapled; Gatekeeper checks their
          # ticket online. The bundle gets the ticket stapled.
          xcrun stapler staple "target/macos/Cua Spacesd.app"
          xcrun stapler validate "target/macos/Cua Spacesd.app"

      - name: Package
        working-directory: libs/cua-spacesd
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          if [ "$SIGN" = true ] && [ "$NOTARIZE" = true ]; then
            echo "macos-universal: Developer ID signed and notarized" > "$RUNNER_TEMP/signing/macos.txt"
          else
            echo "macos-universal: UNSIGNED (ad-hoc signed, not notarized)" > "$RUNNER_TEMP/signing/macos.txt"
          fi
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            bash packaging/release/package.sh --binary target/universal/cua-spacesd \
              --target "$target" --out "$GITHUB_WORKSPACE/dist"
          done
          APP_ZIP=cua-spacesd-macos-universal.app.zip
          ditto -c -k --keepParent "target/macos/Cua Spacesd.app" "$GITHUB_WORKSPACE/dist/$APP_ZIP"
          (cd "$GITHUB_WORKSPACE/dist" && printf '%s  %s\n' "$(shasum -a 256 "$APP_ZIP" | awk '{print $1}')" "$APP_ZIP" > "$APP_ZIP.sha256")
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-spacesd-macos-universal
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-macos
          path: ${{ runner.temp }}/signing/macos.txt
          if-no-files-found: error

  windows:
    needs: version
    name: windows x86_64
    runs-on: [self-hosted, Windows, X64, flip-windows-lab]
    timeout-minutes: 90
    # The Azure Artifact Signing vars live in this environment (as for the
    # Cua Driver release); without it they read empty and signing is skipped.
    environment: cua-driver-release-signing
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: x86_64-pc-windows-msvc
      PUBLISH: ${{ needs.version.outputs.publish }}
      # Static CRT: guests need no VC++ redistributable. Set per target so the
      # workspace .cargo/config.toml rustflags are not overridden.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-spacesd -> target"
          shared-key: libs-cua-spacesd-release
      - name: Require Authenticode for a published release
        if: env.PUBLISH == 'true' && github.repository == 'trycua/cua' && (vars.AZURE_CLIENT_ID == '' || vars.AZURE_ARTIFACT_SIGNING_ENDPOINT == '')
        run: |
          echo "::error::refusing to publish an unsigned cua-spacesd.exe: the Azure Artifact Signing vars are not set in the cua-driver-release-signing environment"
          exit 1
      - name: Build
        working-directory: libs/cua-spacesd
        run: cargo build --locked --release --target "$TARGET" -p cua-spacesd --bin cua-spacesd
      # Authenticode via Azure Artifact Signing (same account as Cua Driver),
      # only when the repository variables are configured.
      - name: Azure login for Artifact Signing
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != ''
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign cua-spacesd.exe
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          # Install the module on every run: a cached one skipped the install and was not found (#5838).
          cache-dependencies: 'false'
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\libs\cua-spacesd\target\x86_64-pc-windows-msvc\release\cua-spacesd.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Cua Spacesd
          description-url: https://cua.ai
      - name: Verify Authenticode signature
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "libs/cua-spacesd/target/$env:TARGET/release/cua-spacesd.exe"
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "invalid Authenticode signature: $($sig.StatusMessage)" }
      - name: Smoke test
        working-directory: libs/cua-spacesd
        run: '"target/$TARGET/release/cua-spacesd.exe" --version'
      - name: Package
        working-directory: libs/cua-spacesd
        run: |
          bash packaging/release/package.sh --binary "target/$TARGET/release/cua-spacesd.exe" \
            --target "$TARGET" --out "$GITHUB_WORKSPACE/dist"
      - name: Signing status
        env:
          AZURE: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          if [ "$AZURE" = true ]; then
            echo "windows-x86_64: Authenticode signed (Azure Artifact Signing)" > "$RUNNER_TEMP/signing/windows.txt"
          else
            echo "windows-x86_64: UNSIGNED (no Authenticode; Azure Artifact Signing vars are not set)" > "$RUNNER_TEMP/signing/windows.txt"
            echo "::warning::cua-spacesd.exe is UNSIGNED (Azure Artifact Signing vars are not set)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-spacesd-${{ env.TARGET }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-windows
          path: ${{ runner.temp }}/signing/windows.txt
          if-no-files-found: error

  # The Cua Spaces build of the `cua` command (cua-spaces-cli, FSL-1.1-MIT), built for the
  # computers MyFlip runs VMs on. Its assets join the cua-spacesd release: each binary is
  # `cua-spaces-cli-<triple>[.exe]` with a `.sha256` file, listed in SHA256SUMS and signed with
  # a Sigstore bundle by the release job.
  cua-cli-linux:
    needs: version
    name: cua-cli linux ${{ matrix.arch }}
    runs-on: [self-hosted, Linux, X64, docker-linux]
    container: debian:11
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, target: aarch64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Install build dependencies
        run: bash libs/cua-spacesd/packaging/release/debian-build-deps.sh
      - *setup_linux_arm64
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: libs/cua
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
            ulimit -Sn "$(ulimit -Hn)"
            cargo zigbuild --target "$TARGET.2.31" --locked --release -p cua-spaces-cli --bin cua-spaces-cli
          else
            cargo build --target "$TARGET" --locked --release -p cua-spaces-cli --bin cua-spaces-cli
          fi
      - name: Check the cross-compiled CLI
        if: matrix.arch == 'aarch64'
        working-directory: libs/cua
        run: bash ../cua-spacesd/packaging/release/check-linux-binary.sh target/${{ matrix.target }}/release/cua-spaces-cli 2.31
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          name="cua-spaces-cli-${{ matrix.target }}"
          cp libs/cua/target/${{ matrix.target }}/release/cua-spaces-cli "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-spacesd-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  cua-cli-macos:
    needs: version
    name: cua-cli macos
    runs-on: [self-hosted, macOS, X64, flip-macos-lab]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build x86_64 and cross-compile arm64 using the macOS SDK
        working-directory: libs/cua
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release --target "$target" -p cua-spaces-cli --bin cua-spaces-cli
          done
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            name="cua-spaces-cli-$target"
            cp "libs/cua/target/$target/release/cua-spaces-cli" "dist/$name"
            (cd dist && shasum -a 256 "$name" > "$name.sha256")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-spacesd-cli-macos
          path: dist/*
          if-no-files-found: error

  cua-cli-windows:
    needs: version
    name: cua-cli windows x86_64
    runs-on: [self-hosted, Windows, X64, flip-windows-lab]
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Go for the Windows VM gateway
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: libs/cua/netgw/go.mod
          cache-dependency-path: libs/cua/netgw/go.sum
      - name: Build
        working-directory: libs/cua
        run: cargo build --locked --release --target "$TARGET" -p cua-spaces-cli --bin cua-spaces-cli
      - name: Build the Windows VM gateway
        working-directory: libs/cua
        env:
          GOOS: windows
          GOARCH: amd64
          CUA_NETGW_VERSION: ${{ needs.version.outputs.version }}
        run: netgw/build.sh "$RUNNER_TEMP/cua-netgw"
      - name: Check the native Windows VM interfaces
        run: |
          cli="libs/cua/target/$TARGET/release/cua-spaces-cli.exe"
          "$cli" host config --help
          "$cli" daemon --help
          "$cli" mcp --help
          "$RUNNER_TEMP/cua-netgw/cua-netgw.exe" -version
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          name="cua-spaces-cli-$TARGET.exe"
          gateway="cua-netgw-$TARGET.exe"
          cp "libs/cua/target/$TARGET/release/cua-spaces-cli.exe" "dist/$name"
          cp "$RUNNER_TEMP/cua-netgw/cua-netgw.exe" "dist/$gateway"
          cp libs/cua/crates/cua-spaces-cli/LICENSE dist/LICENSE-FSL-1.1-MIT
          cp libs/cua/netgw/NOTICE dist/cua-netgw-NOTICE.txt
          cp libs/cua/netgw/LICENSES/Apache-2.0-gvisor-tap-vsock.txt dist/cua-netgw-Apache-2.0-gvisor-tap-vsock.txt
          cd dist
          for file in "$name" "$gateway" LICENSE-FSL-1.1-MIT cua-netgw-*.txt; do
            sha256sum "$file" > "$file.sha256"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-spacesd-cli-windows
          path: dist/*
          if-no-files-found: error

  # Cua's cursor-theme compiler for Flip's server (flip-engineer/flip#2846): the cua-sdk
  # sidecar compiles each owner's hand theme with it. One extra asset of the release,
  # `cua-cursor-theme-x86_64-unknown-linux-gnu` with a `.sha256` file, listed in SHA256SUMS
  # and signed like the others; it is not one of the spacesd targets.
  cursor-theme-linux:
    needs: version
    name: cua-cursor-theme linux x86_64
    runs-on: [self-hosted, Linux, X64, docker-linux]
    timeout-minutes: 90
    container:
      image: "debian:11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Install build dependencies
        run: bash libs/cua-spacesd/packaging/release/debian-build-deps.sh
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt
      - name: Build
        working-directory: libs/cua-driver/rust
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu -p cursor-theme-cli --bin cua-cursor-theme
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          name=cua-cursor-theme-x86_64-unknown-linux-gnu
          cp libs/cua-driver/rust/target/x86_64-unknown-linux-gnu/release/cua-cursor-theme "dist/$name"
          strip "dist/$name"
          "dist/$name" list
          (cd dist && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-spacesd-cursor-theme-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, check-version, linux, macos, windows, cua-cli-linux, cua-cli-macos, cua-cli-windows, cursor-theme-linux]
    if: needs.version.outputs.publish == 'true'
    runs-on:
      group: baton2-native-homelab
      labels: [self-hosted, Linux, X64, baton2-native-linux-x64]
    permissions:
      contents: write
      # Keyless Sigstore signing of the release assets.
      id-token: write
    steps:
      - name: Create a fresh release directory
        id: paths
        run: |
          staging="$(mktemp -d "$RUNNER_TEMP/cua-release.XXXXXX")"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cua-spacesd-*
          path: ${{ steps.paths.outputs.staging }}/release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signing-*
          path: ${{ steps.paths.outputs.staging }}/signing
          merge-multiple: true
      - name: Verify checksums and write SHA256SUMS
        working-directory: ${{ steps.paths.outputs.staging }}/release
        run: |
          set -euo pipefail
          for sum in *.sha256; do sha256sum -c "$sum"; done
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          for f in SHA256SUMS $(awk '{print $2}' SHA256SUMS); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
      - name: Upload to the GitHub release
        working-directory: ${{ steps.paths.outputs.staging }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # release-please creates a draft release with the tag; a hand-pushed
          # tag gets a new release here.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            FLAGS=()
            [ "$PRERELEASE" = true ] && FLAGS+=(--prerelease)
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "cua-spacesd $VERSION" --notes "cua-spacesd $VERSION release assets." \
              "${FLAGS[@]}"
          fi
          # Release Please's draft keeps its assets private (downloads 404);
          # publish it now that every asset is attached. Staging builds and
          # X.Y.Z-suffix versions are prereleases. No cua-spacesd release is
          # ever the repository's Latest: that is the Cua Spaces app's
          # (a stable cua-spacesd release took it from cua-spaces-v0.20.0 on
          # 5 Nov 2026).
          FLAGS=(--draft=false --latest=false)
          [ "$PRERELEASE" = true ] && FLAGS+=(--prerelease)
          if [ "$CANONICAL" != true ] || grep -q UNSIGNED signing/*.txt; then
            label="staging"; [ "$CANONICAL" = true ] && label="test"
            # Name the unsigned platforms: "UNSIGNED: windows-x64".
            unsigned="$(grep -h UNSIGNED signing/*.txt | cut -d: -f1 | sort | paste -sd, - | sed 's/,/, /g')"
            [ -n "$unsigned" ] && label="$label, UNSIGNED: $unsigned"
            {
              echo "**$GITHUB_REPOSITORY prerelease ($label).** Built by cd-cua-spacesd.yml at $GITHUB_REF ($GITHUB_SHA)."
              echo
              echo "Cua Spaces CLI is built from Cua AI, Inc. source under the attached FSL-1.1-MIT license."
              echo
              echo "Signing:"
              echo "- linux: no OS code signing (Sigstore bundle only)"
              sed 's/^/- /' signing/*.txt
            } > notes.md
            FLAGS+=(--title "cua-spacesd $VERSION ($label)" --notes-file notes.md)
          fi
          gh release edit "$TAG" "${FLAGS[@]}" --repo "$GITHUB_REPOSITORY"
          # Release Please's own draft is listed as untagged-<hash>, which the
          # tag lookup above never sees; drop it now that the tagged release is
          # published, or it piles up for good (42 drafts on 8 Nov 2026).
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and (.tag_name | startswith(\"untagged-\")) and .name == \"cua-spacesd: v${VERSION}\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
      # Publishing a draft can still hand this component the repo-wide "Latest"
      # (cua-spacesd 0.12.1 and 0.12.2 did, despite --latest=false). Put it back
      # on Cua Spaces; the release-latest-guard schedule is the backstop.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: always() && github.repository == 'trycua/cua'
        with:
          sparse-checkout: .github/scripts
      - name: Keep Latest on Cua Spaces
        if: always() && github.repository == 'trycua/cua'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pin_latest_release.py

  # Mirror to the downloads CDN (CUA-3941). GitHub stays the source of truth:
  # this job never blocks or fails the release (continue-on-error) but shows a
  # red job and a loud step summary when the CDN copy is incomplete.
  cdn-publish:
    name: Copy to the downloads CDN
    needs: [version, release]
    if: >-
      !cancelled() && github.repository == 'trycua/cua' && needs.release.result == 'success' && needs.version.outputs.publish == 'true'
    runs-on:
      group: baton2-native-homelab
      labels: [self-hosted, Linux, X64, baton2-native-linux-x64]
    continue-on-error: true
    timeout-minutes: 90
    # The publish role trusts main and this environment (OIDC).
    environment: cua-driver-release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          persist-credentials: false
      - uses: ./.github/actions/publish-downloads-cdn
        with:
          tags: |
            ${{ needs.version.outputs.tag }}
